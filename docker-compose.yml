name: criativos-virais
x-app: &app
  image: criativos-virais:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-creatives}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-creatives}
    S3_ENDPOINT: http://rustfs:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creatives}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-creatives}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  rustfs:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${BETTER_AUTH_URL:-http://localhost:3000}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test:
        ["CMD", "curl", "-fsS", "http://127.0.0.1:9001/rustfs/console/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    <<: *app
    profiles: [full]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    profiles: [full]
    command: ["node", "dist/worker.js"]
    stop_grace_period: 35s
volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
