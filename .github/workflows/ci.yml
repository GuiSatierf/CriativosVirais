name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: creatives
          POSTGRES_PASSWORD: ci-only-attribution
          POSTGRES_DB: creatives_attribution_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U creatives -d creatives_attribution_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://creatives:ci-only-attribution@localhost:5432/creatives_attribution_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:security
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:attribution
      - run: npm run build
